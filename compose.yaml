name: async-payment-service-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      API_KEY: ${API_KEY:-dev-secret-key}
      DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.5}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
    ports:
      - "127.0.0.1:${API_PORT:-18100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['API_KEY']}))"
      interval: 3s
      timeout: 3s
      retries: 20

  consumer:
    build: .
    command: python -m app.consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_GATEWAY_BACKEND: ${PAYMENT_GATEWAY_BACKEND:-mock}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.5}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      GATEWAY_MIN_DELAY: ${GATEWAY_MIN_DELAY:-2}
      GATEWAY_MAX_DELAY: ${GATEWAY_MAX_DELAY:-5}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-5}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-1}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
